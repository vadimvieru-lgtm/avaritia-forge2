<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090811">
  <meta name="description" content="Un idle clicker cosmic despre progres imposibil și creații Infinity.">
  <title>AVARITIA — Infinite Forge</title>
  <style>
    /* Temă cosmică și aspect mobil-first. */
    :root{color-scheme:dark;--bg:#090811;--panel:#14121f;--panel2:#1c1929;--line:#343044;--muted:#a5a0b8;--white:#f5f1ff;--violet:#a879ff;--cyan:#69e8ff;--gold:#ffd879;--rainbow:linear-gradient(110deg,#ff5678,#ffb45e,#ffe66b,#62f0a1,#5de3ff,#9b75ff,#ff69ca)}

    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(1px 1px at 15% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 75% 13%,#fff 99%,transparent),radial-gradient(2px 2px at 89% 38%,#a9a1ff 99%,transparent),radial-gradient(1px 1px at 30% 52%,#fff 99%,transparent),radial-gradient(1px 1px at 62% 72%,#fff 99%,transparent),radial-gradient(2px 2px at 9% 84%,#73dfff 99%,transparent),radial-gradient(1px 1px at 92% 91%,#fff 99%,transparent);background-size:310px 290px}
    button{font:inherit;color:inherit;cursor:pointer} .app{position:relative;width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:env(safe-area-inset-top) 14px calc(91px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    header{padding:14px 2px 9px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;letter-spacing:.18em;font-size:14px}.brand span{color:var(--violet)}.header-actions{display:flex;gap:8px}.icon-btn{background:#181522;border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--muted)}
    .resource-card{background:linear-gradient(145deg,#191625ee,#100f1aee);border:1px solid #373248;border-radius:14px;padding:15px 16px 13px;box-shadow:0 12px 35px #0005}.resource-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.save-state{font-size:10px;color:#78e7bb;letter-spacing:0;text-transform:none}.primary-number{font-size:clamp(29px,9vw,42px);line-height:1.1;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:4px 0 9px;text-shadow:0 0 24px #a879ff44}.resource-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.resource-chip{padding:7px 8px;border-radius:8px;background:#ffffff08;border:1px solid #ffffff0c;min-width:0}.resource-chip b{display:block;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-chip small{color:var(--muted);font-size:9px;letter-spacing:.07em;text-transform:uppercase}.rate{color:#74e6bd;font-size:11px;margin-top:9px}
    .hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;flex:1;padding:17px 0 12px}.hero-label{font-size:10px;color:#c7b7e9;letter-spacing:.22em;text-transform:uppercase}.click-orbit{position:relative;width:205px;height:205px;margin:9px 0 5px;display:grid;place-items:center}.orbit{position:absolute;inset:11px;border:1px dashed #a879ff70;border-radius:50%;animation:spin 24s linear infinite}.orbit:after{content:"";position:absolute;top:17px;left:19px;width:7px;height:7px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);border-radius:50%}.orbit.two{inset:0;border:1px solid #ffffff12;animation:spin 35s linear infinite reverse}.click-core{position:relative;width:144px;height:144px;border:0;background:transparent;display:grid;place-items:center;filter:drop-shadow(0 0 24px #9856ff66);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s}.click-core:active{transform:scale(.92)}.click-core .click-texture{position:absolute;z-index:1;width:112px;height:112px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 12px #f6cbff)}.click-core svg{width:100%;height:100%;image-rendering:pixelated;overflow:visible}.core-glow{position:absolute;width:98px;height:98px;border-radius:50%;background:var(--rainbow);filter:blur(27px);opacity:.25;animation:pulse 2.5s ease-in-out infinite}.core-svg{position:relative;animation:float 3.4s ease-in-out infinite}.click-hint{font-size:11px;color:var(--muted)}.click-hint strong{color:var(--gold)}.float-text{position:absolute;left:50%;top:42%;font-weight:900;color:#fff;text-shadow:0 2px 9px #b86cff;pointer-events:none;animation:rise .8s ease-out forwards;z-index:5}.particle{position:absolute;width:5px;height:5px;background:var(--rainbow);box-shadow:0 0 10px #fff;border-radius:1px;pointer-events:none;animation:particle .7s ease-out forwards;z-index:4}
    .collapse-strip{margin:4px 0 11px;padding:10px 12px;border-radius:11px;border:1px solid #624d82;background:linear-gradient(100deg,#201532,#171326);display:flex;justify-content:space-between;align-items:center;gap:8px}.collapse-strip strong{font-size:12px}.collapse-strip small{display:block;color:var(--muted);font-size:10px}.collapse-btn{border:1px solid #a879ff88;background:#8d57d92b;padding:8px 10px;border-radius:8px;color:#e9d9ff;font-weight:800;font-size:10px;white-space:nowrap}.collapse-btn:disabled{opacity:.38;cursor:not-allowed}
    .content{min-height:220px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:1px 2px 9px}.section-head h2{font-size:14px;margin:0}.section-head small{color:var(--muted);font-size:10px}.list{display:grid;gap:8px}.item{background:linear-gradient(140deg,#171522,#12111a);border:1px solid #312d40;border-radius:11px;padding:10px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}.item-icon{position:relative;overflow:hidden;height:42px;width:42px;border-radius:9px;background:#241d35;border:1px solid #4b3a65;display:grid;place-items:center;font-size:21px;image-rendering:pixelated}.item-icon .fallback{z-index:1}.item-icon img{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:contain;image-rendering:pixelated;z-index:2}.import-textures{font-size:9px!important;padding:7px 9px!important;border-color:#72539a!important;color:#e0ceff!important}.item h3{font-size:12px;margin:0 0 2px}.item p{font-size:10px;color:var(--muted);margin:0}.item .owned{color:#d0b7ff;font-size:10px;margin-top:3px}.buy{min-width:78px;padding:8px 7px;background:#392653;border:1px solid #75509d;border-radius:8px;color:#f4e9ff;font-size:10px;font-weight:800}.buy:disabled{opacity:.4;filter:grayscale(.5)}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:10;padding:8px 9px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0d0b15ed;backdrop-filter:blur(15px);border-top:1px solid #393448}.tab{border:1px solid transparent;background:transparent;border-radius:9px;padding:7px 3px 5px;color:#8f899f;font-size:9px}.tab span{display:block;font-size:18px;margin-bottom:2px}.tab.active{color:#e9d9ff;background:#2b203c;border-color:#594171}.rainbow-text{background:var(--rainbow);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 5s linear infinite}.quick-upgrade{width:100%;margin-top:8px;padding:9px 11px;border:1px solid #5a4676;border-radius:10px;background:linear-gradient(100deg,#211831,#171522);display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font-size:10px}.quick-upgrade b{color:#e2cfff;white-space:nowrap}.quick-upgrade:disabled{opacity:.72}.station-shelf{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 9px;scroll-snap-type:x mandatory}.station-tile{flex:0 0 145px;min-height:76px;padding:8px 7px;border:1px solid #3d354f;border-radius:10px;background:#171522;text-align:left;scroll-snap-align:start;display:grid;grid-template-columns:43px 1fr;grid-template-rows:1fr auto;column-gap:7px;align-items:center}.station-tile b{grid-column:2;grid-row:1;font-size:9px;line-height:1.15;margin:0}.station-tile small{grid-column:2;grid-row:2;font-size:8px;color:var(--muted);margin-top:4px}.station-visual{width:40px;height:42px;grid-column:1;grid-row:1/3;display:grid;place-items:center;perspective:180px}.station-cube{position:relative;width:30px;height:30px;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-30deg);transition:transform .5s ease;image-rendering:pixelated}.station-tile:hover .station-cube,.station-tile:focus-visible .station-cube{animation:stationSpin 12s linear infinite}.cube-face{position:absolute;width:30px;height:30px;overflow:hidden;border:1px solid #d4c4ff88;background:linear-gradient(145deg,#a99bbd,#484052);backface-visibility:visible}.cube-face img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.cube-face.front{transform:translateZ(15px)}.cube-face.back{transform:rotateY(180deg) translateZ(15px);background:#282333}.cube-face.right{transform:rotateY(90deg) translateZ(15px);background:linear-gradient(90deg,#51445d,#292431)}.cube-face.left{transform:rotateY(-90deg) translateZ(15px);background:linear-gradient(90deg,#887c93,#41384b)}.cube-face.top{transform:rotateX(90deg) translateZ(15px);background:linear-gradient(145deg,#e1d5ef,#70627f)}.cube-face.bottom{transform:rotateX(-90deg) translateZ(15px);background:#292431}.station-fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;color:#fff;text-shadow:0 1px 4px #000;z-index:0}.cube-face img{position:relative;z-index:1}.station-tile:hover .station-fallback{display:none}@keyframes stationSpin{from{transform:rotateX(-20deg) rotateY(0deg)}to{transform:rotateX(-20deg) rotateY(360deg)}}.station-tile b{display:block;font-size:9px;line-height:1.15;margin-top:3px}.station-tile small{display:block;font-size:8px;color:var(--muted);margin-top:4px}.station-tile.selected{border-color:#bd90ff;background:#2b203c}.station-tile:disabled{opacity:.4;cursor:not-allowed}.achievement{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #353044;background:#171520;border-radius:10px}.achievement.locked{opacity:.48;filter:grayscale(.8)}.achievement .medal{font-size:21px}.achievement b{font-size:11px}.achievement small{display:block;color:var(--muted);font-size:10px}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,12px);padding:9px 14px;border:1px solid #72539a;background:#20172e;border-radius:9px;font-size:11px;opacity:0;transition:.2s;z-index:15;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-wrap{position:fixed;inset:0;background:#05040acc;z-index:20;display:grid;place-items:center;padding:24px}.modal{width:min(100%,390px);padding:19px;border:1px solid #5c4775;border-radius:15px;background:#171421;box-shadow:0 18px 60px #000b}.modal h2{font-size:18px;margin:0 0 7px}.modal p{color:#c1bbd0;font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal-actions button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#242130}.modal-actions .confirm{background:#63349a;border-color:#9364c8;font-weight:800}.hidden{display:none!important}footer{text-align:center;color:#6f6a7c;font-size:9px;padding:11px 0 0}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.15);opacity:.4}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes rise{to{transform:translate(-50%,-46px) scale(1.15);opacity:0}}@keyframes particle{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}@keyframes rainbow{to{background-position:300% 0}}
    @media(min-height:850px){.hero{min-height:340px}.click-orbit{transform:scale(1.12);margin:19px 0}}
    /* Sprite-uri Avaritia din atlasul 32px; mărite fără blur pentru aspectul pixel-art. */
    .cube-face{display:grid;place-items:center}
    .cube-face .atlas-tile{position:absolute;inset:0;overflow:hidden;display:block;image-rendering:pixelated}
    .cube-face .atlas-tile img{position:absolute;width:210px;height:240px;max-width:none;left:calc(var(--sx)*-30px);top:calc(var(--sy)*-30px);image-rendering:pixelated}
    /* Stații: sprite-ul din atlas e deja un cub izometric, deci îl afișăm plat (fără fețe 3D suprapuse). */
    .station-visual{position:relative;display:grid;place-items:center;perspective:180px}
    .station-sprite{display:block;width:36px;height:36px;background-repeat:no-repeat;image-rendering:pixelated;transform-origin:50% 55%;transition:transform .3s}
    .station-tile:hover .station-sprite,.station-tile:focus-visible .station-sprite{animation:stationTurn 3.6s linear infinite}
    .station-import{position:absolute;inset:2px;width:calc(100% - 4px);height:calc(100% - 4px);object-fit:contain;image-rendering:pixelated;z-index:2}
    @keyframes stationTurn{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
    .cube-face img[data-avaritia-item]{z-index:2}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><span>✦</span> AVARITIA <span>INFINITE FORGE</span></div><div class="header-actions"><button class="icon-btn" id="soundBtn" aria-label="Comută sunetul">♪</button><button class="icon-btn" id="resetBtn" aria-label="Resetează jocul">↻</button></div></header>
  <section class="resource-card" aria-label="Resurse"><div class="resource-top"><span>Resurse cosmice</span><span class="save-state" id="saveState">● salvat</span></div><div class="primary-number" id="piles">0</div><div class="resource-row"><div class="resource-chip"><b id="nuggets">0</b><small>Neutron Nuggets</small></div><div class="resource-chip"><b id="ingots">0</b><small>Neutron Ingots</small></div><div class="resource-chip"><b id="catalysts">0</b><small>Infinity Catalysts</small></div></div><div class="rate" id="rate">＋ 0 Neutron Piles / sec</div></section><div id="quickUpgrade"></div>
  <section class="hero"><div class="hero-label">✧ nucleul universului ✧</div><div class="click-orbit"><div class="orbit two"></div><div class="orbit"></div><button class="click-core" id="clicker" aria-label="Colectează Neutron Piles"><span class="core-glow"></span><svg class="core-svg" viewBox="0 0 32 32" shape-rendering="crispEdges" aria-label="Catalizator pixel art"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff28c"/><stop offset=".28" stop-color="#ff8ee8"/><stop offset=".58" stop-color="#7beaff"/><stop offset="1" stop-color="#a36dff"/></linearGradient></defs><path d="M12 2h8v2h4v4h4v4h2v8h-2v4h-4v4h-4v2h-8v-2H8v-4H4v-4H2v-8h2V8h4V4h4z" fill="#0c0a15" stroke="#ceb4ff" stroke-width=".6"/><path d="M13 4h6v2h4v4h3v6h-2v3h-3v4h-5v3h-4v-3H8v-4H6v-7h3v-4h4z" fill="url(#g)"/><path d="M14 7h4v3h4v4h-3v3h-3v4h-3v-5H9v-4h4v-3h1z" fill="#fff5ff" opacity=".92"/><path d="M4 14h3v2H4zm21-8h2v3h-2zM9 24h3v2H9zm13-3h3v2h-3z" fill="#fff"/></svg></button></div><div class="click-hint">Atinge pentru <strong id="clickPower">+1</strong> pile</div></section>
  <section class="collapse-strip"><div><strong>☄ Singularity Collapse</strong><small id="collapseInfo">Reîncepe pentru Infinity Coins permanente</small></div><button class="collapse-btn" id="collapseBtn" disabled>COLLAPSE · 0</button></section>
  <section class="content" id="content"></section>
  <footer>Progresul se salvează automat pe acest dispozitiv · v1.0</footer>
</main>
<nav class="tabbar" aria-label="Navigare"><button class="tab active" data-tab="factory"><span>⚙</span>FABRICĂ</button><button class="tab" data-tab="craft"><span>✧</span>UPGRADE</button><button class="tab" data-tab="stats"><span>☷</span>REALIZĂRI</button><button class="tab" data-tab="codex"><span>▤</span>CODEx</button><button class="tab" data-tab="workshop"><span>⚒</span>STAȚII</button></nav><div class="toast" id="toast"></div>
<div class="modal-wrap hidden" id="modal"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="modal-actions"><button id="cancelModal">Anulează</button><button class="confirm" id="confirmModal">Continuă</button></div></div></div>
<script>
(() => {
  'use strict';
  const KEY='avaritia-infinite-forge-v1';
  // Conținutul economic: costurile cresc exponențial pentru ritmul idle/clicker.
  const generators=[
    {id:'collector',name:'Neutron Collector',icon:'☄',description:'Adună neutroni dintr-un câmp de particule.',base:15,growth:1.16,rate:0.2},
    {id:'compressor',name:'Compressor',icon:'▣',description:'Comprimă neutronii în fluxuri dense.',base:120,growth:1.17,rate:2.5},
    {id:'table',name:'Extreme Crafting Table',icon:'▦',description:'Asamblează materie la scară extremă.',base:1200,growth:1.18,rate:35},
    {id:'altar',name:'Infinity Altar',icon:'✧',description:'Canalizează energia infinitului.',base:15000,growth:1.2,rate:550}
  ];
  const upgrades=[
    {id:'gloves',name:'Mănuși de singularitate',icon:'✊',desc:'Puterea clickului ×2.',base:80,type:'click'},
    {id:'resonance',name:'Rezonanță de neutron',icon:'♢',desc:'Producția tuturor generatorilor ×2.',base:500,type:'global'},
    {id:'meatballs',name:'Cosmic Meatballs',icon:'●',desc:'Miez cosmic: click și producție ×3.',base:4500,type:'global3'},
    {id:'swarm',name:'Infinity Swarm',icon:'✣',desc:'Un roi infinit multiplică producția ×5.',base:60000,type:'global5'},
    {id:'armor',name:'Infinity Armor',icon:'⬡',desc:'Protecție absolută: click ×10.',base:25000,type:'click10'}
  ];
  const achievements=[
    ['first','Primul neutron','Adună 1 Neutron Pile.',s=>s.lifetime>=1],['hundred','Masa critică','Adună 100 Neutron Piles.',s=>s.lifetime>=100],['million','Vastitatea','Adună 1 milion de pile.',s=>s.lifetime>=1e6],['collector','Automatizare','Deține 10 Neutron Collectors.',s=>s.generators.collector>=10],['artisan','Meșteșugar cosmic','Cumpără un Cosmic Meatballs.',s=>s.upgrades.meatballs],['collapse','Dincolo de început','Execută primul Singularity Collapse.',s=>s.collapses>=1],['infinity','Infinity','Adună 1 miliard de pile într-o viață.',s=>s.lifetime>=1e9]
  ];
  const fresh=()=>({piles:0,lifetime:0,totalClicks:0,crafted:{'Crafting Table':1},generators:{collector:0,compressor:0,table:0,altar:0},upgrades:{gloves:false,resonance:false,meatballs:false,swarm:false,armor:false},coins:0,collapses:0,achievements:[],last:Date.now(),tab:'factory',sound:false});
  let state=load(), tab=state.tab||'factory', toastTimer;
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x)return fresh();const d=fresh();return {...d,...x,crafted:{...d.crafted,...(x.crafted||{}),'Crafting Table':Math.max(1,(x.crafted||{})['Crafting Table']||1)},generators:{...d.generators,...x.generators},upgrades:{...d.upgrades,...x.upgrades},achievements:Array.isArray(x.achievements)?x.achievements:[]}}catch{return fresh()}}
  function save(){state.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state));document.querySelector('#saveState').textContent='● salvat'}catch{document.querySelector('#saveState').textContent='⚠ spațiu plin'}}
  function fmt(n){if(!Number.isFinite(n))return '∞';if(n<1000)return Math.floor(n).toLocaleString('ro-RO');const units=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No'];let e=Math.floor(Math.log10(n)/3);if(e<=units.length)return (n/1000**e).toFixed(e>3?1:2).replace(/\.0+$|(?<=\.[0-9])0$/,'')+units[e-1];return n.toExponential(2)}
  function cost(item,count){return Math.floor(item.base*Math.pow(item.growth,count))}
  function clickPower(){let m=1+(state.coins*.1);if(state.upgrades.gloves)m*=2;if(state.upgrades.armor)m*=10;if(state.upgrades.meatballs)m*=3;return m}
  function multiplier(){let m=1+state.coins*.1;if(state.upgrades.resonance)m*=2;if(state.upgrades.meatballs)m*=3;if(state.upgrades.swarm)m*=5;return m}
  function perSecond(){return generators.reduce((sum,g)=>sum+state.generators[g.id]*g.rate,0)*multiplier()}
  function earn(n){state.piles+=n;state.lifetime+=n}
  function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
  function updateHeader(){renderQuickUpgrade();refreshPurchaseButtons();document.querySelector('#piles').textContent=fmt(state.piles);document.querySelector('#nuggets').textContent=fmt(state.piles/10);document.querySelector('#ingots').textContent=fmt(state.piles/1000);document.querySelector('#catalysts').textContent=fmt(state.piles/1e6);document.querySelector('#rate').textContent=`＋ ${fmt(perSecond())} Neutron Piles / sec`;document.querySelector('#clickPower').textContent=fmt(clickPower());const gain=Math.floor(Math.sqrt(state.lifetime/1e5));document.querySelector('#collapseBtn').disabled=gain<1;document.querySelector('#collapseBtn').textContent=`COLLAPSE · ${fmt(gain)}`;document.querySelector('#collapseInfo').textContent=gain?`Câștigă ${fmt(gain)} Infinity Coins · bonus permanent +10% / coin`:`Necesită 100.000 pile adunate într-o viață`}
  function render(){updateHeader();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderQuickUpgrade();const root=document.querySelector('#content');if(tab==='factory')root.innerHTML=factoryHTML();else if(tab==='craft')root.innerHTML=craftHTML();else if(tab==='codex')root.innerHTML=codexHTML();else if(tab==='workshop')root.innerHTML=workshopHTML();else root.innerHTML=statsHTML();root.querySelectorAll('[data-buy-gen]').forEach(b=>b.onclick=()=>buyGen(b.dataset.buyGen));root.querySelectorAll('[data-buy-up]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.buyUp));root.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craftItem(b.dataset.craft));root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{codexFilter=b.dataset.filter;drawCodex()});const search=document.querySelector('#codexSearch');if(search)search.oninput=drawCodex;if(tab==='codex'){drawCodex();wireTextureImport()}if(tab==='workshop')drawWorkshop();}

  let selectedStation='Crafting Table';
  let quickKey='';
  function renderClickTexture(){const core=document.querySelector('#clicker');if(!core)return;const old=core.querySelector('.click-texture');if(old)old.remove();const img=document.createElement('img');img.className='click-texture';img.src='textures/avaritia/textures/items/resource_infinity_catalyst.png';img.onerror=()=>{img.src='textures/avaritia/textures/item/resource_infinity_catalyst.png';img.onerror=()=>img.remove()};img.onload=()=>{const svg=core.querySelector('.core-svg');if(svg)svg.style.display='none';core.appendChild(img)}}
  function renderQuickUpgrade(){const box=document.querySelector('#quickUpgrade');if(!box)return;const options=generators.map(g=>({id:'gen:'+g.id,name:g.name,cost:cost(g,state.generators[g.id]),buy:()=>buyGen(g.id)})).concat(upgrades.filter(u=>!state.upgrades[u.id]).map(u=>({id:'up:'+u.id,name:u.name,cost:u.base*(u.type==='global'?Math.pow(5,state.collapses):1),buy:()=>buyUpgrade(u.id)})));options.sort((a,b)=>a.cost-b.cost);const chosen=options.find(x=>state.piles>=x.cost)||options[0];if(!chosen){box.innerHTML='';return}const key=chosen.id+':'+chosen.cost;if(key!==quickKey){quickKey=key;box.innerHTML='<button class="quick-upgrade" id="quickBuy"><span>⬆ Cumpără rapid · '+chosen.name+'</span><b>'+fmt(chosen.cost)+' PILE</b></button>';document.querySelector('#quickBuy').onclick=()=>chosen.buy()}const button=document.querySelector('#quickBuy');if(button)button.disabled=state.piles<chosen.cost}


  function stationOwned(name){return name==='Crafting Table'||(state.crafted[name]||0)>0}
  function workshopHTML(){const owned=stationNames.filter(stationOwned);if(!owned.includes(selectedStation))selectedStation='Crafting Table';return '<div class="section-head"><h2>Atelier de crafting</h2><button class="icon-btn import-textures" type="button">IMPORTĂ TEXTURI</button></div><div class="station-shelf">'+stationNames.map(name=>'<button class="station-tile '+(selectedStation===name?'selected':'')+'" data-station="'+name+'" '+(!stationOwned(name)?'disabled':'')+'>'+stationIconMarkup(name)+'<b>'+name+'</b><small>'+(stationOwned(name)?'deținută · '+(name==='Crafting Table'?'∞':state.crafted[name]||0):'neconstruită')+'</small></button>').join('')+'</div><div id="stationRecipes"></div>'}
  // Coordonate de sprite din atlasul Avaritia (7 coloane x 8 rânduri, celule 32px).
  // Stațiile extinse din joc folosesc cea mai apropiată stație din versiunea clasică.
  const stationSprites={
    'Crafting Table':{file:'station_crafting_table.png'},
    'Compressed Crafting Table':{atlas:[1,0]},
    'Double Compressed Crafting Table':{atlas:[0,3]},
    'Nether Crafting Table':{file:'station_nether_table.png'},
    'End Crafting Table':{file:'station_end_table.png'},
    'Sculk Crafting Table':{file:'station_sculk_table.png'},
    'Dire Crafting Table':{atlas:[2,2]},
    'Dire Crafting Table Mk XX':{atlas:[0,7]},
    'Extreme Crafting Table':{atlas:[2,2]},
    'Neutron Collector':{atlas:[5,0]},
    'Neutronium Collector':{atlas:[5,0]},
    'Neutronium Compressor':{atlas:[3,5]},
    'Dense Neutronium Collector':{atlas:[5,0],filter:'hue-rotate(170deg) saturate(1.8)'},
    'Denser Neutronium Collector':{atlas:[5,0],filter:'hue-rotate(260deg) saturate(2)'},
    'Densest Neutronium Collector':{atlas:[5,0],filter:'hue-rotate(330deg) saturate(2.2) brightness(1.1)'},
    'Dense Neutronium Compressor':{atlas:[3,5],filter:'hue-rotate(170deg) saturate(1.8)'},
    'Denser Neutronium Compressor':{atlas:[3,5],filter:'hue-rotate(260deg) saturate(2)'},
    'Densest Neutronium Compressor':{atlas:[3,5],filter:'hue-rotate(330deg) saturate(2.2) brightness(1.1)'},
    'Extreme Anvil':{file:'station_extreme_anvil.png'},
    'Extreme Smithing Table':{file:'station_smithing_table.png'}
  };
  function stationIcon(name){return name.includes('Collector')?'☄':name.includes('Compressor')?'▣':name.includes('Extreme')?'▦':name.includes('Dire')?'▤':name.includes('Anvil')?'⚒':'▦'}
  function stationIconMarkup(name){const sp=stationSprites[name]||{file:'station_crafting_table.png'},base='textures/avaritia/',style=sp.atlas?'background-image:url('+base+'Tilesheet_AV_32_0.png);background-size:252px 288px;background-position:'+(-sp.atlas[0]*36)+'px '+(-sp.atlas[1]*36)+'px':'background-image:url('+base+sp.file+');background-size:36px 36px',filt=sp.filter?';filter:'+sp.filter:'';return '<span class=\"station-visual\" aria-label=\"Previzualizare '+name+'\"><span class=\"station-sprite\" style=\"'+style+filt+'\"></span>'+(textureFiles[name]?'<img class=\"station-import\" data-avaritia-item=\"'+name+'\" alt=\"\">':'')+'</span>'}
  function drawWorkshop(){const root=document.querySelector('#stationRecipes');if(!root)return;document.querySelectorAll('[data-station]').forEach(b=>b.onclick=()=>{if(!stationOwned(b.dataset.station))return;selectedStation=b.dataset.station;render()});const tableTiers=['Compressed Crafting Table','Double Compressed Crafting Table','Nether Crafting Table','End Crafting Table','Sculk Crafting Table','Extreme Crafting Table','Dire Crafting Table','Dire Crafting Table Mk XX'];const aliases=[selectedStation];if(selectedStation.includes('Collector'))aliases.push('Neutron Collector','Neutronium Collector');if(selectedStation.includes('Compressor'))aliases.push('Neutronium Compressor');const rows=codexItems.filter(x=>aliases.includes(x.station)||(tableTiers.includes(selectedStation)&&x.station==='Crafting Table'));const cards=rows.map(x=>{const count=state.crafted[x.name]||0;return '<article class="item"><div class="item-icon '+(x.group.includes('Infinity')?'rainbow-text':'')+'">'+textureIcon(x)+'</div><div><h3>'+x.name+'</h3><p>'+x.recipe+'</p><div class="owned">fabricate: '+count+' · cost clicker: '+fmt(x.cost)+' piles</div></div><button class="buy" data-work-craft="'+codexItems.indexOf(x)+'" '+(state.piles<x.cost?'disabled':'')+'>FABRICĂ<br>'+fmt(x.cost)+'</button></article>'}).join('');let special='';if(selectedStation==='Extreme Anvil'){const gear=['World Breaker','Sword of the Cosmos','Planet Eater',"Nature's Ruin",'Longbow of the Heavens','Infinity Helmet','Infinity Breastplate','Infinity Pants','Infinity Boots'];const choices=gear.filter(n=>(state.crafted[n]||0)>(state.crafted['Reforged '+n]||0));special='<div class="item"><div class="item-icon">⚒</div><div><h3>Forjă și reparații</h3><p>Reforjează echipamentul Infinity pe care l-ai fabricat. Simulare de atelier; rețetele diferă între versiuni.</p><div class="owned">'+(choices.length?'Echipament disponibil: '+choices.length:'Fabrică mai întâi un obiect Infinity')+'</div></div><div class="reforge-list">'+choices.map(n=>'<button class="buy reforge-btn" data-reforge="'+n+'" '+(state.piles<100000?'disabled':'')+'>REFORJARE<br>100K</button>').join('')+'</div></div>'}root.innerHTML='<div class="section-head" style="margin-top:12px"><h2>'+selectedStation+'</h2><small>'+rows.length+' rețete</small></div>'+(cards||'<p style="font-size:11px;color:var(--muted)">Nu există rețete de fabricare pentru această stație în toate versiunile.</p>')+special+'<p style="font-size:10px;color:var(--muted);margin:10px 2px">Stațiile folosesc sprite-uri pixel-art din atlasul Avaritia inclus; pentru textura completă specifică versiunii tale, importă JAR-ul local. Unele stații extinse sunt variante fan-made.</p>';root.querySelectorAll('[data-work-craft]').forEach(b=>b.onclick=()=>craftItem(Number(b.dataset.workCraft)));root.querySelectorAll('[data-reforge]').forEach(b=>b.onclick=()=>reforgeItem(b.dataset.reforge));wireTextureImport()}
function reforgeItem(name){if(state.piles<100000||(state.crafted[name]||0)<=(state.crafted['Reforged '+name]||0))return;state.piles-=100000;state.crafted['Reforged '+name]=(state.crafted['Reforged '+name]||0)+1;toast(name+' reforjat!');render();save()}


  function refreshPurchaseButtons(){document.querySelectorAll('[data-buy-gen]').forEach(b=>{const id=b.dataset.buyGen,g=generators.find(x=>x.id===id);b.disabled=state.piles<cost(g,state.generators[id])});document.querySelectorAll('[data-buy-up]').forEach(b=>{const u=upgrades.find(x=>x.id===b.dataset.buyUp),price=u.base*(u.type==='global'?Math.pow(5,state.collapses):1);b.disabled=!!state.upgrades[u.id]||state.piles<price});document.querySelectorAll('[data-craft],[data-work-craft]').forEach(b=>{const i=Number(b.dataset.craft??b.dataset.workCraft),item=codexItems[i];b.disabled=!item||state.piles<item.cost});document.querySelectorAll('[data-reforge]').forEach(b=>{const n=b.dataset.reforge;b.disabled=state.piles<100000||(state.crafted[n]||0)<=(state.crafted['Reforged '+n]||0)})}

  function buyGen(id){const g=generators.find(x=>x.id===id),c=cost(g,state.generators[id]);if(state.piles<c)return;state.piles-=c;state.generators[id]++;render();save()}
  function buyUpgrade(id){const u=upgrades.find(x=>x.id===id);let c=u.base*(u.type==='global'?Math.pow(5,state.collapses):1);if(state.upgrades[id]||state.piles<c)return;state.piles-=c;state.upgrades[id]=true;toast(`${u.name} fabricat!`);render();save()}
  function particles(){const host=document.querySelector('.click-orbit'),r=host.getBoundingClientRect();for(let i=0;i<8;i++){const p=document.createElement('i');p.className='particle';const a=Math.PI*2*i/8+Math.random()*.4,d=55+Math.random()*40;p.style.left=`${r.width/2}px`;p.style.top=`${r.height/2}px`;p.style.setProperty('--dx',`${Math.cos(a)*d}px`);p.style.setProperty('--dy',`${Math.sin(a)*d}px`);host.appendChild(p);setTimeout(()=>p.remove(),750)}const f=document.createElement('span');f.className='float-text';f.textContent=`+${fmt(clickPower())}`;host.appendChild(f);setTimeout(()=>f.remove(),850)}
  document.querySelector('#clicker').addEventListener('pointerdown',e=>{e.preventDefault();let gain=clickPower();earn(gain);state.totalClicks++;particles();updateHeader();if(state.sound){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=420;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.045)}catch{}}});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;state.tab=tab;render();save()}));
  document.querySelector('#collapseBtn').onclick=()=>{const gain=Math.floor(Math.sqrt(state.lifetime/1e5));if(gain<1)return;showModal('Singularity Collapse',`Colapsul va reseta pile-urile, generatorii și upgrade-urile acestei runde. Vei primi ${fmt(gain)} Infinity Coins, fiecare oferind +10% permanent la click și producție. Continui?`,()=>{state.coins+=gain;state.collapses++;state.piles=0;state.lifetime=0;state.generators=fresh().generators;state.upgrades=fresh().upgrades;tab='factory';render();save();toast(`+${fmt(gain)} Infinity Coins`)})};
  function showModal(title,text,action){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=text;document.querySelector('#modal').classList.remove('hidden');document.querySelector('#confirmModal').onclick=()=>{document.querySelector('#modal').classList.add('hidden');action()}}
  document.querySelector('#cancelModal').onclick=()=>document.querySelector('#modal').classList.add('hidden');document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')});
  document.querySelector('#resetBtn').onclick=()=>showModal('Ștergi universul?', 'Această acțiune elimină tot progresul salvat pe acest dispozitiv.',()=>{state=fresh();tab='factory';save();render();toast('Univers nou creat')});
  document.querySelector('#soundBtn').onclick=e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?'♫':'♪';save();toast(state.sound?'Sunet activat':'Sunet oprit')};
  // Calculează câștigul offline la revenire, limitat la 24 de ore.
  const away=Math.max(0,Math.min((Date.now()-(state.last||Date.now()))/1000,86400));if(away>5&&perSecond()>0){const gain=perSecond()*away;earn(gain);setTimeout(()=>toast(`Bine ai revenit! +${fmt(gain)} pile offline`),400)}
  render();renderClickTexture();document.querySelector('#soundBtn').textContent=state.sound?'♫':'♪';let last=Date.now();setInterval(()=>{const now=Date.now(),dt=Math.min((now-last)/1000,5);last=now;if(dt>0){earn(perSecond()*dt);updateHeader();refreshPurchaseButtons()}},250);setInterval(save,5000);window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
})();
</script>
</body>
</html>
